<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listado de activos | Gestión de Activos ULEAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/activos.css">
</head>
<body>
  <div class="app">

    <aside class="menu">
      <div class="menu__marca">
        <div class="menu__logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        <div>
          <small>Universidad Laica</small>
          <strong>Gestión de Activos</strong>
        </div>
      </div>

      <nav class="menu__nav">
        <a class="menu__enlace" href="dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>
        <a class="menu__enlace menu__enlace--activo" href="activos.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
          Activos
        </a>
        <a class="menu__enlace" href="registrar.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Registrar
        </a>
        <a class="menu__enlace" href="reportes.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
          Reportes
        </a>
      </nav>

      <div class="menu__perfil">
        <div class="menu__avatar" id="perfil-avatar">AM</div>
        <div>
          <strong id="perfil-nombre">Andrea Mendoza</strong>
          <small id="perfil-rol">Administradora</small>
        </div>
      </div>
      <a class="menu__enlace" href="index.html" id="cerrar-sesion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5M15 12H3M15 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4"/></svg>
        Cerrar sesión
      </a>
    </aside>

    <main class="contenido">
      <header class="encabezado">
        <div>
          <h1>Listado de activos</h1>
          <p>Consulta y administra los bienes registrados</p>
        </div>
        <span class="estado-sistema">Sistema operativo</span>
      </header>

      <section class="pagina">
        <p id="aviso" class="aviso aviso--exito" role="status" hidden></p>

        <div class="tarjeta tarjeta--tabla">

          <!-- Barra de herramientas: buscador, filtros y botón de alta -->
          <div class="herramientas">
            <div class="buscador">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input type="search" id="buscador" placeholder="Buscar por código, nombre o responsable…" aria-label="Buscar activos" autocomplete="off">
            </div>
            <select id="filtro-categoria" class="filtro" aria-label="Filtrar por categoría"></select>
            <select id="filtro-estado" class="filtro" aria-label="Filtrar por estado"></select>
            <a href="registrar.html" class="boton boton--primario">+ Nuevo activo</a>
          </div>

          <!-- Tabla: las filas las dibuja activos.js -->
          <div class="tabla-contenedor">
            <table class="tabla">
              <thead>
                <tr>
                  <th>Código</th>
                  <th>Nombre</th>
                  <th>Categoría</th>
                  <th>Responsable</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="filas"></tbody>
            </table>
          </div>

          <div class="pie-tabla">
            <span id="contador"></span>
            <nav class="paginacion" id="paginacion" aria-label="Paginación"></nav>
          </div>
        </div>
      </section>
    </main>

  </div>

  <!-- Ventana para confirmar la baja de un activo -->
  <dialog id="modal-baja" class="modal">
    <form id="form-baja" novalidate>
      <h2>Dar de baja el activo</h2>
      <p class="modal__texto" id="modal-texto"></p>

      <div class="campo" id="campo-motivo">
        <label for="motivo">Motivo de la baja</label>
        <select id="motivo"></select>
        <span class="campo__mensaje" id="mensaje-motivo"></span>
      </div>

      <div class="modal__acciones">
        <button type="button" class="boton" id="baja-cancelar">Cancelar</button>
        <button type="submit" class="boton boton--primario">Confirmar baja</button>
      </div>
    </form>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/activos.js"></script>
</body>
</html>
