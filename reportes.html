<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes | Gestión de Activos ULEAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/reportes.css">
</head>
<body>
  <div class="app">

    <aside class="menu">
      <div class="menu__marca">
        <div class="menu__logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        <div>
          <small>Universidad Laica</small>
          <strong>Gestión de Activos</strong>
        </div>
      </div>

      <nav class="menu__nav">
        <a class="menu__enlace" href="dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>
        <a class="menu__enlace" href="activos.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
          Activos
        </a>
        <a class="menu__enlace" href="registrar.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Registrar
        </a>
        <a class="menu__enlace menu__enlace--activo" href="reportes.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
          Reportes
        </a>
      </nav>

      <div class="menu__perfil">
        <div class="menu__avatar" id="perfil-avatar">AM</div>
        <div>
          <strong id="perfil-nombre">Andrea Mendoza</strong>
          <small id="perfil-rol">Administradora</small>
        </div>
      </div>
      <a class="menu__enlace" href="index.html" id="cerrar-sesion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5M15 12H3M15 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4"/></svg>
        Cerrar sesión
      </a>
    </aside>

    <main class="contenido">
      <header class="encabezado">
        <div>
          <h1>Reportes</h1>
          <p>Historial de altas y bajas de activos</p>
        </div>
        <span class="estado-sistema">Sistema operativo</span>
      </header>

      <section class="pagina">
        <p id="aviso" class="aviso aviso--exito" role="status" hidden></p>

        <!-- Filtros por rango de fechas -->
        <form id="form-filtros" class="tarjeta filtros" novalidate>
          <div class="campo" id="campo-desde">
            <label for="desde">Desde</label>
            <input type="date" id="desde">
            <span class="campo__mensaje" id="mensaje-desde"></span>
          </div>

          <div class="campo" id="campo-hasta">
            <label for="hasta">Hasta</label>
            <input type="date" id="hasta">
            <span class="campo__mensaje" id="mensaje-hasta"></span>
          </div>

          <button type="submit" class="boton">Aplicar filtros</button>
          <button type="button" class="boton boton--primario" id="boton-exportar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 11l5 5 5-5M5 21h14"/></svg>
            Exportar
          </button>
        </form>

        <!-- Historial de movimientos -->
        <div class="tarjeta tarjeta--tabla">
          <div class="historial__cabecera">
            <div>
              <h2>Historial de movimientos</h2>
              <p id="subtitulo"></p>
            </div>
            <span class="periodo" id="periodo"></span>
          </div>

          <div class="tabla-contenedor">
            <table class="tabla">
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Activo</th>
                  <th>Movimiento</th>
                  <th>Motivo</th>
                </tr>
              </thead>
              <tbody id="filas"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

  </div>

  <script src="js/storage.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/reportes.js"></script>
</body>
</html>
